<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <meta name="description" content="Page not found.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --text: #f5f7fb;
      --muted: rgba(255, 255, 255, 0.9);
      --line: rgba(255, 255, 255, 0.1);
      --pink: #ff2ea6;
      --blue: #24c8ff;
      --shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(36, 200, 255, 0.14), transparent 30%),
        radial-gradient(circle at 100% 0%, rgba(255, 46, 166, 0.14), transparent 28%),
        linear-gradient(180deg, #08080a 0%, #040404 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
      background-size: 100% 34px;
      opacity: 0.18;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent 85%);
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.03;
      background-image: radial-gradient(#ffffff 0.6px, transparent 0.6px);
      background-size: 12px 12px;
    }

    .panel {
      position: relative;
      width: min(720px, 100%);
      padding: 42px 34px;
      border-radius: 28px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.025));
      box-shadow: var(--shadow);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--blue);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-size: 0.74rem;
      font-weight: 800;
      white-space: nowrap;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(3rem, 8vw, 5rem);
      line-height: 0.95;
    }

    p {
      margin: 0 auto 24px;
      max-width: 46ch;
      color: var(--muted);
      line-height: 1.75;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), #ff68be);
      box-shadow: 0 20px 44px rgba(255, 46, 166, 0.28);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--text);
      text-decoration: none;
      font-weight: 900;
      letter-spacing: 0.34em;
      font-size: 0.98rem;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--blue));
      box-shadow: 0 0 18px rgba(36, 200, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <main class="panel">
    <a class="brand" href="index.html">
      <span class="brand-dot"></span>
      <span>ZERONE</span>
    </a>
    <p class="eyebrow">404 • PAGE NOT FOUND</p>
    <h1>Lost in the grid.</h1>
    <p>
      The page you were looking for is missing, moved, or never made it out of prototype.
      Return to the main page and get back on the right signal path.
    </p>
    <a class="button" href="index.html">Back to Home</a>
  </main>
</body>
</html>
